<!doctype html><meta charset="utf-8"><title>iScreenX · 等待画面</title>
<style>html,body{margin:0;height:100%;background:#101114;color:white;font:16px "Segoe UI",sans-serif}canvas{width:100%;height:100%;object-fit:contain;display:block}p{position:absolute;inset:45% 0 auto;text-align:center}</style>
<canvas></canvas><p>正在连接 iPhone 画面…</p>
<script>
(async()=>{
 const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),msg=document.querySelector('p');
 let count=0,needKey=true;
 function status(s){msg.hidden=false;msg.textContent=s}
 const decoder=new VideoDecoder({output(frame){
   if(canvas.width!==frame.displayWidth || canvas.height!==frame.displayHeight){
     canvas.width=frame.displayWidth;canvas.height=frame.displayHeight;
   }
   ctx.drawImage(frame,0,0,canvas.width,canvas.height);frame.close();msg.hidden=true;
   count++;if(count===1 || count%120===0){
     document.title='iScreenX · '+canvas.width+' × '+canvas.height;
     fetch(location.pathname+'/frames/'+count+'/'+canvas.width+'x'+canvas.height).catch(()=>{});
   }
 },error(e){status(e.message)}});
 const reader=(await fetch(location.pathname+'/video')).body.getReader();
 let chunk=new Uint8Array(),offset=0;
 async function read(n){
   const b=new Uint8Array(n);let pos=0;
   while(pos<n){
     if(offset===chunk.length){const r=await reader.read();if(r.done)throw Error('投屏已结束');chunk=r.value;offset=0;}
     const l=Math.min(n-pos,chunk.length-offset);b.set(chunk.subarray(offset,offset+l),pos);pos+=l;offset+=l;
   }return b;
 }
 for(;;){
   const h=new DataView((await read(13)).buffer),type=h.getUint8(0),n=h.getUint32(1,true);
   if(n>16*1024*1024)throw Error('视频数据长度异常');
   const data=await read(n);
   if(type===1){
     if(data.length<7)continue;
     decoder.configure({codec:'avc1.'+Array.from(data.slice(1,4),v=>v.toString(16).padStart(2,'0')).join(''),description:data,optimizeForLatency:true});
     needKey=true;
   }else if(decoder.state==='configured'){
     let key=false;
     const v=new DataView(data.buffer);
     for(let i=0;i+4<data.length;){const len=v.getUint32(i);i+=4;if(!len||len>data.length-i)throw Error('H.264 数据格式错误');if((data[i]&31)===5)key=true;i+=len}
     if(needKey&&!key)continue;needKey=false;
     decoder.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:h.getFloat64(5,true),data}));
   }
 }
})().catch(e=>{const p=document.querySelector('p');p.hidden=false;p.textContent=e.message});
</script>
