<!doctype html><html lang="zh-CN" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iScreenX · 屏幕镜像</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--toolbar-height:30px;color-scheme:light;--paper:#f8f9fb;--bar:#fff;--ink:#22252a;--muted:#606670;--line:#10182116;--well:#eceef2;--blue:#2968bb;--panel:#fffffff5;--shadow:#17213820}
:root[data-theme=dark]{color-scheme:dark;--paper:#191b20;--bar:#222429;--ink:#f4f5f7;--muted:#adb1b9;--line:#ffffff20;--well:#32353c;--blue:#95bbff;--panel:#25272df7;--shadow:#0006}
html,body{height:100%;margin:0;overflow:hidden}body{display:grid;grid-template-rows:var(--toolbar-height) minmax(0,1fr);font:14px/1.45 Inter,"Segoe UI","Microsoft YaHei UI",sans-serif;color:var(--ink);background:var(--paper)}
button{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:9px;padding:0 10px 0 15px;background:var(--bar);box-shadow:inset 0 -1px var(--line);z-index:2;app-region:drag;-webkit-app-region:drag;user-select:none}.tools{display:flex;align-items:center;gap:3px;margin-left:auto;app-region:no-drag;-webkit-app-region:no-drag}.tools button,.dismiss{height:29px;min-width:31px;padding:0 6px;display:inline-grid;place-items:center;border-radius:7px;color:var(--muted)}.tools button:hover,.dismiss:hover,.tools [aria-expanded=true]{background:var(--well);color:var(--ink)}.tools #close:hover{color:white;background:#df454a}.divider{width:1px;height:14px;background:var(--line);margin:0 4px}.tools #record-toggle{color:#db4f55}
main{position:relative;min-height:0;overflow:hidden;display:grid;place-items:center;background:var(--paper)}main.live{background:#000}.waiting{display:grid;justify-items:center;align-content:center;max-width:100%;text-align:center;padding:20px;gap:clamp(9px,min(1.55vw,2.35vh),20px)}.art{font-size:clamp(16px,min(2.7vw,4.3vh),34px);position:relative;width:8em;height:5.5em;margin:0 auto 0.8125em}.monitor,.phone{position:absolute;border:0.125em solid #868d99;border-radius:0.5625em;background:var(--paper);padding:0.25em}.monitor{width:6.5625em;height:4.1875em;left:0.0625em;top:0.1875em;box-shadow:0 0.25em 0.5em var(--shadow)}.phone{width:2.25em;height:3.9375em;right:0.25em;bottom:0.0625em;border-radius:0.5em;padding:0.1875em;box-shadow:-0.1875em 0.125em 0.4375em var(--shadow)}.art i{display:block;width:100%;height:100%;border-radius:0.25em;background:radial-gradient(ellipse 97% 106% at 88% -15%,#cedcf5 55%,transparent 57%),radial-gradient(ellipse 98% 132% at 5% 120%,#869ac9 48%,transparent 50%),linear-gradient(135deg,#c8cef0,#a5b7d9 65%,#8498bf)}.stand{position:absolute;top:4.3125em;left:2.875em;width:0.875em;height:0.5625em;background:#9096a1}.stand:after{content:'';position:absolute;width:2.1875em;left:-0.6875em;bottom:-0.125em;height:0.1875em;background:#9298a4;border-radius:0.25em}
h1,h2,p{margin:0}h1{font-size:clamp(22px,min(4vw,6.5vh),52px);letter-spacing:-1px;font-weight:600}.waiting p{font-size:clamp(13px,min(1.8vw,2.9vh),22px);color:var(--muted)}.target{display:inline-flex;align-items:center;gap:7px;background:var(--bar);border:1px solid var(--line);border-radius:99px;padding:.48em 1.05em;margin-top:.3em;font-size:clamp(12px,min(1.6vw,2.6vh),20px);max-width:100%}.target #name{min-width:0;overflow-wrap:anywhere}.target svg{width:1.15em;height:1.15em;flex:none;color:var(--blue)}#help{color:var(--blue);font-size:clamp(12px,min(1.55vw,2.5vh),18px);padding:.55em .85em}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.resize-handle{position:fixed;width:12px;height:12px;z-index:3;touch-action:none;app-region:no-drag;-webkit-app-region:no-drag}
[data-edge="1"],[data-edge="2"]{top:12px;bottom:12px;height:auto;width:8px;cursor:ew-resize}
[data-edge="1"]{left:0}[data-edge="2"]{right:0}
[data-edge="3"],[data-edge="6"]{left:12px;right:12px;width:auto;height:8px;cursor:ns-resize}
[data-edge="3"]{top:0}[data-edge="6"]{bottom:0}
[data-edge="4"]{top:0;left:0;cursor:nwse-resize}[data-edge="5"]{top:0;right:0;cursor:nesw-resize}
[data-edge="7"]{bottom:0;left:0;cursor:nesw-resize}[data-edge="8"]{bottom:0;right:0;cursor:nwse-resize}
:fullscreen .resize-handle{display:none}
:fullscreen body:has(main.live){grid-template-rows:minmax(0,1fr)}
:fullscreen body:has(main.live) header{position:absolute;inset:0 0 auto;height:var(--toolbar-height);transform:translateY(calc(5px - 100%));opacity:0}
:fullscreen body:has(main.live) header:hover,:fullscreen body:has(main.live) header:focus-within,:fullscreen body:has(dialog[open]) header{transform:none;opacity:1}
:fullscreen main.live canvas{object-fit:cover}
.stream-info{position:absolute;top:10px;left:12px;display:inline-flex;align-items:center;padding:4px 9px;border:1px solid #ffffff24;border-radius:8px;background:rgb(20 23 27 / 50%);color:#e3e5e8;font:500 12px/16px "Segoe UI",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
main:not(.live) .stream-info{display:none}
#frame-rate{color:#79ed9d;font-weight:600;margin-right:8px;padding-right:8px;border-right:1px solid #ffffff38}
dialog{margin:0;position:fixed;inset:calc(var(--toolbar-height) + 4px) 9px auto auto;width:min(286px,calc(100vw - 18px));max-height:calc(100dvh - var(--toolbar-height) - 13px);overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--panel);backdrop-filter:blur(24px);color:var(--ink);box-shadow:0 10px 40px var(--shadow);padding:15px 16px;font:inherit}dialog[open]{display:grid;gap:13px}dialog::backdrop{background:transparent}.row,.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet-head h2{font-size:16px;letter-spacing:-.4px}.sheet-head small,dialog p{font-size:12px;color:var(--muted)}dialog p{line-height:1.65}.sheet-head small{margin-right:auto}.dismiss{min-width:24px;height:24px;font-size:18px}.segment{display:flex;background:var(--well);border-radius:8px;padding:2px}.segment button{min-width:56px;padding:4px;border-radius:6px;font-size:12px}.segment [aria-pressed=true]{background:var(--bar);box-shadow:0 1px 4px var(--shadow)}.switch{width:37px;height:22px;border-radius:20px;background:#a0a4ab;padding:2px;flex:none}.switch:after{content:'';display:block;width:18px;height:18px;background:white;border-radius:50%;box-shadow:0 1px 3px #0003}.switch[aria-checked=true]{background:#32b66c}.switch[aria-checked=true]:after{transform:translateX(15px)}#volume{width:105px;accent-color:var(--blue)}.row output{font-size:12px;color:var(--muted)}.section-end{border-bottom:1px solid var(--line);padding-bottom:12px}.record{background:#d74752;color:white;padding:8px;border-radius:9px}#theme{display:flex;align-items:center;gap:6px;background:var(--well);border-radius:8px;padding:4px 9px;font-size:12px}#theme svg{width:15px}.guide{padding-left:20px;margin:0;font-size:13px;line-height:1.7}.guide li+li{margin-top:6px}
@media(max-width:500px){.tools{gap:0}.divider{margin:0 2px}header{padding:0 5px;gap:5px}.tools button{min-width:26px;padding:0 4px}}
@media(max-height:370px){.art{display:none}}
#pin[aria-pressed=true] svg{fill:currentColor;color:var(--blue)}
.control-fields{display:grid;gap:10px}
.control-fields input[aria-invalid=true]{--error-border:#c43840;border-color:var(--error-border);box-shadow:inset 0 0 0 1px var(--error-border);outline:none}
[data-theme=dark] .control-fields input[aria-invalid=true]{--error-border:#ff8087}
.control-fields input{width:46%;min-width:0;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--well);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.password-field{width:46%;position:relative}
.password-field input{width:100%;padding-right:32px}
.password-field input::-ms-reveal{display:none}
.password-field button{position:absolute;right:2px;top:2px;width:27px;height:26px;display:none;place-items:center;padding:0;color:var(--muted);border-radius:5px;touch-action:none;user-select:none}
.password-field:focus-within button{display:grid}
.password-field button:active{color:var(--blue)}
.control-actions{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:6px}
.control-actions button{padding:6px 4px;border-radius:7px;background:var(--well);color:var(--muted);font-size:12px;cursor:default}
</style>
<body><svg style="display:none" aria-hidden="true"><defs>

<symbol id="wireless" viewBox="0 0 24 24"><path d="M2 8q10-9 20 0M5 12q7-6 14 0m-11 4q4-4 8 0"/><circle cx="12" cy="19" r="1"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 019 4a9 9 0 1011 11z"/></symbol>
<symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
<symbol id="tune" viewBox="0 0 24 24"><path d="M3 7h6m4 0h8M3 17h11m4 0h3"/><circle cx="11" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol>
<symbol id="audio" viewBox="0 0 24 24"><path d="M3 10h4l5-4v12l-5-4H3zm12-1q3 3 0 6m3-9q6 6 0 12"/></symbol>
<symbol id="rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></symbol>
<symbol id="pointer" viewBox="0 0 24 24"><path d="m5 3 14 9-7 1-3 7z"/></symbol></defs></svg>
<header><div class="tools">
<button id="record-toggle" data-sheet="record-sheet" title="屏幕录制" aria-label="屏幕录制"><svg><use href="#rec"/></svg></button>
<button id="pin" title="窗口置顶" aria-label="窗口置顶" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(35 12 12)"><path d="M8 3h8v2l-1 1v4l3 3v2H6v-2l3-3V6L8 5z"/><path d="M12 15v6"/></g></svg></button>
<button data-sheet="settings" title="投屏设置" aria-label="投屏设置"><svg><use href="#tune"/></svg></button>
<button id="full" title="全屏" aria-label="全屏"><svg><use href="#expand"/></svg></button><span class="divider"></span>
<button id="minimize" title="最小化" aria-label="最小化"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><button id="close" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div></header>
<main aria-label="投屏画面"><div class="waiting"><div class="art" aria-hidden="true"><div class="stand"></div><div class="monitor"><i></i></div><div class="phone"><i></i></div></div>
<h1>等待屏幕镜像</h1><p>从 iPhone 控制中心选择这个接收端</p><div class="target"><svg><use href="#wireless"/></svg><span id="name">正在查找…</span></div>
<button id="help" data-sheet="guide">连接指南 ›</button></div><canvas hidden aria-label="iPhone 实时画面"></canvas>
<div class="stream-info" role="group" aria-label="投屏信息"><span id="frame-rate" hidden></span><span id="resolution"></span></div></main>
<dialog id="settings" aria-label="投屏设置">
<div class="row">画质<div class="segment" role="group" aria-label="画质" id="quality"><button data-value="720" aria-pressed="true">中等</button><button data-value="1080" aria-pressed="false">高清</button></div></div>
<div class="row">帧率<div class="segment" role="group" aria-label="帧率" id="fps"><button data-value="30" aria-pressed="true">30 fps</button><button data-value="60" aria-pressed="false">60 fps</button></div></div>
<p class="section-end">画质和帧率在下次连接镜像时生效。</p>
<div class="row">设备声音<button class="switch" role="switch" aria-label="设备声音" aria-checked="true" id="sound"></button></div>
<div class="row section-end"><label for="volume">音量</label><input type="range" min="0" max="100" value="75" id="volume"><output for="volume">75%</output></div>
<div class="row"><label for="control">反控手机(需越狱)</label><button class="switch" role="switch" aria-checked="false" id="control"></button></div>
<div class="control-fields section-end">
 <div class="row"><label for="ssh-port">SSH 端口</label><input id="ssh-port" type="number" min="1" max="65535" step="1" value="2222"></div>
 <div class="row"><label for="root-password">root 密码</label><div class="password-field"><input id="root-password" type="password" autocomplete="off" spellcheck="false"><button type="button" id="peek-password" aria-label="按住查看密码" title="按住查看密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
 <div class="control-actions"><button type="button" title="检测手机的 SSH 连接" disabled>连接检测</button><button type="button" disabled>注入反控插件</button><button type="button" disabled>反控检测</button></div>
</div>
<div class="row"><label for="show-info">显示帧率和分辨率</label><button class="switch" role="switch" aria-checked="true" id="show-info"></button></div>
<div class="row">外观<button id="theme"><svg><use href="#moon"/></svg><span id="theme-label"></span></button></div></dialog>
<dialog id="record-sheet" aria-labelledby="rec-title"><div class="sheet-head"><h2 id="rec-title">屏幕录制</h2><small>交互预览</small><button class="dismiss" aria-label="关闭录制面板">×</button></div><p>仅录制手机画面和声音。<br>跟随投屏设置 · <span id="format">中等 · 30 fps</span></p><button class="record" aria-pressed="false" id="record">预览录制</button></dialog>
<dialog id="guide" aria-labelledby="guide-title"><div class="sheet-head"><h2 id="guide-title">连接指南</h2><button class="dismiss" aria-label="关闭连接指南">×</button></div><ol class="guide"><li>将手机与电脑连到同一局域网。</li><li>打开控制中心，点击「屏幕镜像」。</li><li>选择“iScreenX-XXX”的设备。</li></ol></dialog>
<span class="resize-handle" data-edge="1" aria-hidden="true"></span><span class="resize-handle" data-edge="2" aria-hidden="true"></span><span class="resize-handle" data-edge="3" aria-hidden="true"></span><span class="resize-handle" data-edge="6" aria-hidden="true"></span>
<span class="resize-handle" data-edge="4" aria-hidden="true"></span><span class="resize-handle" data-edge="5" aria-hidden="true"></span>
<span class="resize-handle" data-edge="7" aria-hidden="true"></span><span class="resize-handle" data-edge="8" aria-hidden="true"></span>
<script>

const $=s=>document.querySelector(s),base=location.pathname,canvas=$('canvas'),ctx=canvas.getContext('2d');
const rateLabel=$('#frame-rate');
const password=$('#root-password'),peek=$('#peek-password');
const sshPort=$('#ssh-port');
function validateControl(focus){
 const invalidPort=!sshPort.value || !sshPort.validity.valid;
 const missingPassword=password.value.length===0;
 for(const [field,invalid] of [[sshPort,invalidPort],[password,missingPassword]]){
  if(invalid)field.setAttribute('aria-invalid','true');
  else field.removeAttribute('aria-invalid');
 }
 if(focus && (invalidPort || missingPassword))(invalidPort?sshPort:password).focus();
 return !invalidPort && !missingPassword;
}
for(const field of [sshPort,password])field.addEventListener('input',()=>{
 if($('.control-fields [aria-invalid=true]'))validateControl(false);
});
function maskPassword(){password.type='password'}
peek.onpointerdown=e=>{
 if(!e.isPrimary||e.button!==0)return;
 e.preventDefault();
 peek.setPointerCapture(e.pointerId);
 password.type='text';
};
peek.onpointermove=e=>{
 if(peek.hasPointerCapture(e.pointerId) && !peek.contains(document.elementFromPoint(e.clientX,e.clientY)))maskPassword();
};
peek.onpointerup=peek.onpointercancel=peek.onlostpointercapture=maskPassword;
peek.onkeydown=e=>{
 if(e.key===' '||e.key==='Enter'){e.preventDefault();password.type='text'}
};
peek.onkeyup=maskPassword;
password.parentElement.addEventListener('focusout',maskPassword);
window.addEventListener('blur',maskPassword);
document.addEventListener('visibilitychange',maskPassword);
$('#settings').addEventListener('close',maskPassword);
const pin=$('#pin');
const host=window.chrome?.webview;
host?.addEventListener('message',event=>{
 if(event.data==='control-on'||event.data==='control-off'){
  $('#control').setAttribute('aria-checked',String(event.data==='control-on'));
  $('#control').disabled=false;return;
 }
 if(event.data!=='pinned' && event.data!=='unpinned')return;
 const pinned=event.data==='pinned';
 pin.setAttribute('aria-pressed',String(pinned));
 pin.title=pinned?'取消置顶':'窗口置顶';
});
pin.onclick=()=>host?.postMessage('toggle-pin');
host?.postMessage('pin-state');
host?.postMessage('control-state');
for(const handle of document.querySelectorAll('.resize-handle')){
 handle.onpointerdown=e=>{
  if(e.button!==0)return;
  e.preventDefault();
  window.chrome?.webview?.postMessage('resize:'+handle.dataset.edge);
 };
}
function reportGeometry(width,height){
 const bar=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--toolbar-height'));
 window.chrome?.webview?.postMessage(['geometry:'+width,height,bar,innerWidth].join('/'));
}
reportGeometry(16,9);
const waitingHint=$('.waiting p').textContent;
const streamInfo=$('.stream-info');
streamInfo.hidden=/(?:^|; )streamInfo=off(?:;|$)/.test(document.cookie);
$('#show-info').setAttribute('aria-checked',String(!streamInfo.hidden));
for(const trigger of document.querySelectorAll('[data-sheet]')){
 const sheet=document.getElementById(trigger.dataset.sheet);
 trigger.setAttribute('aria-haspopup','dialog');
 trigger.setAttribute('aria-controls',sheet.id);
 trigger.setAttribute('aria-expanded','false');
 trigger.onclick=()=>{sheet.showModal();trigger.setAttribute('aria-expanded','true')};
 sheet.onclose=()=>trigger.setAttribute('aria-expanded','false');
 sheet.querySelector('.dismiss')?.addEventListener('click',()=>sheet.close());
 sheet.onclick=e=>{
  const r=sheet.getBoundingClientRect();
  if(e.target===sheet && (e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom))sheet.close();
 };
}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const displayGroups=[$('#quality'),$('#fps')];
const savedMode='{{displayMode}}'.split('/');
function updateFormat(){
 const selected=displayGroups.map(group=>group.querySelector('[aria-pressed=true]'));
 $('#format').textContent=selected.map(option=>option.textContent).join(' · ');
 return selected.map(option=>option.dataset.value).join('/');
}
for(const [index,group] of displayGroups.entries()){
 const saved=group.querySelector('[data-value="'+savedMode[index]+'"]');
 if(saved)for(const option of group.children)option.setAttribute('aria-pressed',String(option===saved));
 group.addEventListener('click',event=>{
  const chosen=event.target.closest('button');if(!chosen)return;
  for(const option of group.querySelectorAll('button'))option.setAttribute('aria-pressed',String(option===chosen));
  window.chrome?.webview?.postMessage('display:'+updateFormat());
 });
}
updateFormat();
for(const toggle of document.querySelectorAll('.switch')){
 toggle.onclick=()=>{
  const enabled=toggle.getAttribute('aria-checked')!=='true';
  if(toggle.id==='control'){
   if(enabled && !validateControl(true))return;
   toggle.disabled=true;host?.postMessage(enabled?'control-on':'control-off');return;
  }
  toggle.setAttribute('aria-checked',String(enabled));
  if(toggle.id==='sound'){$('#volume').disabled=!enabled;applyVolume()}
  if(toggle.id==='show-info'){
   streamInfo.hidden=!enabled;
   document.cookie='streamInfo='+(enabled?'on':'off')+'; Path=/; Max-Age=31536000; SameSite=Strict';
  }
 };
}
function applyVolume(){window.chrome?.webview?.postMessage('volume:'+($('#volume').disabled?'0':$('#volume').value))}
$('#volume').oninput=()=>{$('output[for=volume]').textContent=$('#volume').value+'%';applyVolume()};
applyVolume();
let recordingTimer;
$('#record').onclick=()=>{
 const button=$('#record'),start=button.getAttribute('aria-pressed')!=='true';
 button.setAttribute('aria-pressed',String(start));
 clearInterval(recordingTimer);
 if(!start){button.textContent='预览录制';return}
 const beginning=Date.now();
 const tick=()=>{
  const seconds=Math.floor((Date.now()-beginning)/1000);
  button.textContent='结束预览 · '+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 };
 tick();recordingTimer=setInterval(tick,500);
};
function appearance(theme){
 document.documentElement.dataset.theme=theme;
 window.chrome?.webview?.postMessage('theme-'+theme);
 const label=theme==='dark'?'切换浅色外观':'切换深色外观';
 $('#theme-label').textContent=theme==='dark'?'深色':'浅色';
 $('#theme').title=label;$('#theme').setAttribute('aria-label',label);
 $('#theme use').setAttribute('href',theme==='dark'?'#sun':'#moon');
}
const preference=document.cookie.match(/(?:^|; )theme=(light|dark)/);
appearance(preference?preference[1]:'light');
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';appearance(t);document.cookie='theme='+t+'; Path=/; Max-Age=31536000; SameSite=Strict'};
$('#full').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()};
document.onfullscreenchange=()=>{const label=document.fullscreenElement?'退出全屏':'全屏';$('#full').title=label;$('#full').setAttribute('aria-label',label)};
for(const command of ['minimize','close'])$('#'+command).onclick=()=>window.chrome.webview.postMessage(command);
function waiting(message,detail=''){
 rateLabel.hidden=true;canvas.hidden=true;$('.waiting').hidden=false;$('main').classList.remove('live');
 $('.waiting h1').textContent=message;$('.waiting p').textContent=detail||waitingHint;
}
async function play(id){
 let first=true,needKey=true,lengthSize=4,failure;
 const response=await fetch(base+'/video/'+id);
 if(!response.ok)throw Error('无法读取视频通道');
 const reader=response.body.getReader();
 let drawn=0,sampleStart=0;
 const frames=[];
 let animation=0,decoded=0,displayed=0,maxQueue=0,origin=null,previousStamp=null;
 // Use the sender clock to space out frames that arrived together over Wi-Fi.
 let playoutDelay=75,desiredDelay=75,decoderConfig;
 const compressed=[];
 let decodeTimer=0,queuedBytes=0;
 const timing=new Map(),localAges=[],sourceAges=[];
 function percentile(values,fraction){
  if(!values.length)return -1;
  const sorted=values.slice().sort((a,b)=>a-b);
  return Math.round(sorted[Math.floor((sorted.length-1)*fraction)]);
 }
 const delayPoll=setInterval(async()=>{
  try{
   const response=await fetch(base+'/delay'),value=Number(await response.text());
   if(value>=70 && value<=460)desiredDelay=value;
  }catch{}
 },300);
 function clearFrames(){while(frames.length)frames.shift().frame.close();origin=previousStamp=null;}
 function paint(now){
  animation=0;
  // Allow one refresh of scheduling jitter before skipping a ready frame.
  while(frames.length>1 && frames[1].at<now-12)frames.shift().frame.close();
  const item=frames.length && frames[0].at<=now+3?frames.shift():null;
  if(frames.length)animation=requestAnimationFrame(paint);
  if(!item)return;
  const frame=item.frame;
  try{
   const resized=canvas.width!==frame.displayWidth||canvas.height!==frame.displayHeight;
   if(resized){canvas.width=frame.displayWidth;canvas.height=frame.displayHeight}
   ctx.drawImage(frame,0,0,canvas.width,canvas.height);
   localAges.push(performance.now()-item.arrival);
   if(Number.isFinite(item.sourceAge))sourceAges.push(item.sourceAge);
   drawn++;displayed++;if(!sampleStart)sampleStart=performance.now();
   if(first||resized){
    $('#resolution').textContent=canvas.width+' × '+canvas.height;
    reportGeometry(canvas.width,canvas.height);
   }
   if(first){
    first=false;canvas.hidden=false;$('.waiting').hidden=true;$('main').classList.add('live');
    fetch(base+'/first-frame').catch(()=>{});
   }
  }finally{frame.close()}
 }
 const decoder=new VideoDecoder({output(frame){
  decoded++;
  const meta=timing.get(frame.timestamp);
  timing.delete(frame.timestamp);
  if(!meta || document.hidden){frame.close();return;}
  frames.push({frame,at:meta.due,arrival:meta.arrival,sourceAge:meta.arrival-meta.source});
  while(frames.length>10)frames.shift().frame.close();
  if(!animation)animation=requestAnimationFrame(paint);
 },error(e){failure=e;reader.cancel()}});
 function presentationTime(timestamp,arrival){
  const stamp=timestamp/1000;
  playoutDelay+=Math.max(-3,Math.min(3,desiredDelay-playoutDelay));
  const offset=arrival-stamp;
  if(origin===null || stamp<=previousStamp || stamp-previousStamp>1000 || Math.abs(origin-offset)>1000){
   origin=offset;
  }else{
   // The earliest arrival is a low-delay clock reference. A packet burst must
   // not move that reference forward and add another full buffer at the decoder.
   origin=Math.min(origin+0.02,offset);
  }
  previousStamp=stamp;
  return origin+stamp+playoutDelay;
 }
 function pumpDecoder(){
  clearTimeout(decodeTimer);
  decodeTimer=0;
  try{
   while(compressed.length){
    const next=compressed[0],wait=next.due-performance.now()-65;
    if(decoder.decodeQueueSize>=6)return; // The dequeue event wakes the pump.
    if(!document.hidden && wait>1 && compressed.length<96){
     decodeTimer=setTimeout(pumpDecoder,Math.ceil(wait));return;
    }
    compressed.shift();queuedBytes-=next.data.length;
    timing.set(next.timestamp,next);
    if(timing.size>128)timing.delete(timing.keys().next().value);
    decoder.decode(new EncodedVideoChunk({type:next.type,timestamp:next.timestamp,data:next.data}));
    next.data=null;
    maxQueue=Math.max(maxQueue,decoder.decodeQueueSize);
   }
  }catch(e){failure=e;reader.cancel()}
 }
 decoder.ondequeue=()=>{if(compressed.length && !decodeTimer)pumpDecoder()};
 function resetDecoder(){
  clearTimeout(decodeTimer);decodeTimer=queuedBytes=0;compressed.length=0;
  decoder.reset();clearFrames();timing.clear();needKey=true;
 }
 const report=setInterval(()=>{
  fetch(base+'/vstats/'+[decoded,displayed,maxQueue,percentile(localAges,.5),percentile(localAges,.95),percentile(sourceAges,.5)].join('/')).catch(()=>{});
  decoded=displayed=maxQueue=0;localAges.length=sourceAges.length=0;
 },15000);
 const meter=setInterval(()=>{
  if(!sampleStart)return;
  const now=performance.now(),elapsed=now-sampleStart;
  if(elapsed<950)return;
  rateLabel.textContent=Math.round(drawn*1000/elapsed)+'fps';
  rateLabel.hidden=false;drawn=0;sampleStart=now;
 },250);
 let chunk=new Uint8Array(),offset=0;
 async function read(n){
   const b=new Uint8Array(n);let pos=0;
   while(pos<n){
     if(offset===chunk.length){const r=await reader.read();if(r.done){if(failure)throw failure;return null}chunk=r.value;offset=0}
     const l=Math.min(n-pos,chunk.length-offset);b.set(chunk.subarray(offset,offset+l),pos);pos+=l;offset+=l;
   }return b;
 }
 try{
  for(;;){
   const header=await read(29);if(!header)break;
   const h=new DataView(header.buffer),type=h.getUint8(0),n=h.getUint32(1,true);
   if(n>16*1024*1024)throw Error('视频数据长度异常');
   const data=await read(n);if(!data)break;
   if(type===1){
    if(data.length<7)continue;
    const previous=decoderConfig?.description;
    if(previous && previous.length===data.length && data.every((byte,i)=>byte===previous[i]))continue;
    if(decoderConfig)resetDecoder();
    lengthSize=(data[4]&3)+1;
    decoderConfig={codec:'avc1.'+Array.from(data.slice(1,4),v=>v.toString(16).padStart(2,'0')).join(''),description:data,optimizeForLatency:true};
    decoder.configure(decoderConfig);needKey=true;
   }else if(decoderConfig){
    let key=false;
    for(let i=0;i<data.length;){
     if(i+lengthSize>data.length)throw Error('H.264 数据格式错误');
     let len=0;for(let j=0;j<lengthSize;j++)len=len*256+data[i++];
     if(!len||len>data.length-i)throw Error('H.264 数据格式错误');
     if((data[i]&31)===5)key=true;i+=len;
    }
    const timestamp=Math.trunc(h.getFloat64(5,true)),arrival=h.getFloat64(13,true)-performance.timeOrigin;
    const source=h.getFloat64(21,true)-performance.timeOrigin;
    // Only abandon a reference chain when its replacement keyframe is in hand.
    // Otherwise drain it before reading more compressed data.
    const full=()=>compressed.length>=96 || queuedBytes+data.length>32*1024*1024;
    if(key && full())resetDecoder();
    while(full() && !failure){pumpDecoder();if(full())await delay(4)}
    if(failure)throw failure;
    if(needKey&&!key)continue;
    if(decoder.state!=='configured')decoder.configure(decoderConfig);
    needKey=false;
    compressed.push({type:key?'key':'delta',timestamp,data,arrival,source,due:presentationTime(timestamp,arrival)});
    queuedBytes+=data.length;
    if(!decodeTimer || document.hidden)pumpDecoder();
   }
  }
 }finally{decoder.ondequeue=null;clearTimeout(decodeTimer);clearInterval(delayPoll);clearInterval(report);cancelAnimationFrame(animation);clearFrames();clearInterval(meter);rateLabel.hidden=true;if(decoder.state!=='closed')decoder.close();await reader.cancel().catch(()=>{})}
}
(async()=>{
 for(;;){
  try{
   const response=await fetch(base+'/status');if(!response.ok)throw Error();
   const [name,id,device]=(await response.text()).split('\n');$('#name').textContent=name;
   if(id){
    waiting('正在连接',device);
    try{await play(id)}catch(e){waiting('正在恢复画面',e.message)}
   }else waiting('等待屏幕镜像');
  }catch{waiting('接收端已离线','请重新打开 iScreenX')}
  await delay(400);
 }
})();
</script></html>
